services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - medibook_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - medibook_internal


  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec"
      ]

    volumes:
      - medibook_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - medibook_internal


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod

    restart: unless-stopped

    env_file:
      - .env.production

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    expose:
      - "8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - medibook_internal


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    environment:
      NODE_ENV: production
      MEDIBOOK_INTERNAL_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: /api/v1

    depends_on:
      backend:
        condition: service_healthy

    expose:
      - "3000"

    networks:
      - medibook_internal


  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./deploy/nginx/medibook.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro

    networks:
      - medibook_internal


networks:

  medibook_internal:
    driver: bridge


volumes:

  medibook_postgres_data:
  medibook_redis_data:
