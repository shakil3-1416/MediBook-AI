limit_req_zone $binary_remote_addr zone=medibook_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=medibook_auth:10m rate=5r/m;

server {
    listen 80;
    server_name medibook.example.com;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after TLS certificate is installed.
    #
    # location / {
    #     return 301 https://$host$request_uri;
    # }


    # Temporary HTTP deployment before TLS activation.
    location /api/v1/auth/ {
        limit_req zone=medibook_auth burst=10 nodelay;

        proxy_pass http://backend:8000/api/v1/auth/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api/v1/ {
        limit_req zone=medibook_api burst=30 nodelay;

        proxy_pass http://backend:8000/api/v1/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }


    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "DENY" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;
}
