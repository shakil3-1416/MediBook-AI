[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medibook-ai"
version = "0.1.0"
description = "Qwen-powered doctor discovery, calendar, and appointment platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<9.0",
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "structlog>=25.1,<27.0",
    "python-multipart>=0.0.20,<1.0",
    "boto3>=1.35,<2.0",
    "cryptography>=46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<3.0",
]

agent = [
    "openai>=1.60,<3.0",
    "langgraph>=0.2,<2.0",
    "langchain-core>=0.3,<2.0",
]

rag = [
    "chromadb>=1.0,<2.0",
]

security = [
    "pwdlib[argon2]>=0.2,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true