services:
  postgres:
    image: postgres:17-alpine
    container_name: medibook-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: medibook
      POSTGRES_USER: medibook
      POSTGRES_PASSWORD: medibook

    ports:
      - "5434:5432"

    volumes:
      - medibook_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibook -d medibook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medibook-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - medibook_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medibook_postgres_data:
  medibook_redis_data:
